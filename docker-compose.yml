services:
  mongo:
    image: mongo:9
    restart: unless-stopped
    ports:
      # Loopback only: host tools (npm run dev, mongosh) can connect, the network cannot.
      # The app container reaches mongo over the compose network, not this mapping.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override MONGODB_URI so the app finds the mongo *service*, not localhost
      MONGODB_URI: mongodb://mongo:27017/the-daily-web
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
